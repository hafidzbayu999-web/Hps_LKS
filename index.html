
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Masonry Layout</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        /* DESKTOP */
        .desktop {
            max-width: 960px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .box {
            background-color: #ccc;
            width: 100%;
        }

        .small {
            height: 150px;
        }

        .medium {
            height: 200px;
        }

        .large {
            height: 300px;
        }

        /* MOBILE */
        .mobile {
            display: none;
        }

        @media screen and (max-width: 720px) {

            body {
                padding: 15px;
            }

            .desktop {
                display: none;
            }

            .mobile {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }

            .mobile .column {
                gap: 8px;
            }

            .mobile .box {
                height: auto;
            }

            .mobile .large {
                aspect-ratio: 1 / 1;
            }

            .mobile .medium {
                aspect-ratio: 2 / 1;
            }

            .mobile .small {
                aspect-ratio: 2 / 1;
            }
        }
    </style>
</head>

<body>

    <!-- DESKTOP LAYOUT -->
    <div class="desktop">

        <div class="column">
            <div class="box large"></div>
            <div class="box medium"></div>
            <div class="box large"></div>
        </div>

        <div class="column">
            <div class="box small"></div>
            <div class="box large"></div>
            <div class="box large"></div>
        </div>

        <div class="column">
            <div class="box medium"></div>
            <div class="box small"></div>
            <div class="box large"></div>
        </div>

    </div>

    <!-- MOBILE LAYOUT -->
    <div class="mobile">

        <div class="column">
            <div class="box large"></div>
            <div class="box medium"></div>
            <div class="box medium"></div>
            <div class="box small"></div>
            <div class="box large"></div>
        </div>

        <div class="column">
            <div class="box small"></div>
            <div class="box large"></div>
            <div class="box medium"></div>
            <div class="box medium"></div>
        </div>

    </div>

</body>
</html>
