
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C2. Compare Image</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px 15px;
        }

        h2 {
            margin-bottom: 30px;
        }

        /* Tempat gambar */
        .container {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: auto;
            overflow: hidden;
            line-height: 0;
        }

        .container img {
            width: 100%;
            display: block;
        }

        /* Gambar hitam putih */
        .grayscale {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            clip-path: inset(0 50% 0 0);
        }

        .grayscale img {
            filter: grayscale(100%);
        }

        /* Garis pembatas */
        .divider {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 2px;
            background: white;
            transform: translateX(-50%);
            pointer-events: none;
        }

        /* Lingkaran */
        .circle {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 24px;
            height: 24px;
            background: white;
            border: 1px solid gray;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        /* Slider */
        input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            opacity: 0;
            cursor: ew-resize;
        }

    </style>
</head>

<body>

    <h2>C2. Compare Image</h2>

    <div class="container">

        <!-- Gambar normal -->
        <img src="image.webp" alt="Gambar berwarna">

        <!-- Gambar hitam putih -->
        <div class="grayscale" id="grayscale">
            <img src="image.webp" alt="Gambar grayscale">
        </div>

        <!-- Garis dan lingkaran -->
        <div class="divider" id="divider">
            <div class="circle"></div>
        </div>

        <!-- Penggeser -->
        <input type="range" min="0" max="100"
        value="50" id="slider">

    </div>

    <script>

        const slider = document.getElementById("slider");
        const grayscale = document.getElementById("grayscale");
        const divider = document.getElementById("divider");

        slider.addEventListener("input", function() {

            let posisi = slider.value;

            grayscale.style.clipPath =
                "inset(0 " + (100 - posisi) + "% 0 0)";

            divider.style.left = posisi + "%";

        });

    </script>

</body>
</html>
